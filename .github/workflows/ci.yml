name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test-and-gate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (editable, with dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run unit + end-to-end tests
        run: pytest -q

      - name: Run the evaluation gate (deterministic, offline)
        run: python -m eval_gate run --suite fixtures/suite.yaml --baseline fixtures/baseline.json

      - name: Prove the gate fails on a regression (must exit non-zero)
        run: |
          if python -m eval_gate run --suite fixtures/suite_regressed.yaml --baseline fixtures/baseline.json --no-report; then
            echo "::error::gate did NOT fail on the regressed suite"
            exit 1
          else
            echo "gate correctly returned non-zero on the regressed suite"
          fi

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report-py${{ matrix.python-version }}
          path: reports/report.html
