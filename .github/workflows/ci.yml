name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  test-and-gate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (editable, with dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run unit + end-to-end tests
        run: pytest -q --ignore=tests/test_mutation.py

      # Run separately from the line above so it shows up as its own named step
      # in the CI log. Everything else here proves the gate behaves correctly on
      # a fixture. This proves the test suite would notice if the checking code
      # broke, by breaking it on purpose, once per defect, and requiring the
      # suite to go red each time. It carries its own control: an unmutated copy
      # must still pass, otherwise "the suite failed" proves nothing.
      - name: Prove the test suite itself can fail (mutation harness)
        run: pytest -q tests/test_mutation.py

      - name: Run the evaluation gate (deterministic, offline)
        run: python -m eval_gate run --suite fixtures/suite.yaml --baseline fixtures/baseline.json

      - name: Prove the gate fails on a regression (must exit non-zero)
        run: |
          if python -m eval_gate run --suite fixtures/suite_regressed.yaml --baseline fixtures/baseline.json --no-report; then
            echo "::error::gate did NOT fail on the regressed suite"
            exit 1
          else
            echo "gate correctly returned non-zero on the regressed suite"
          fi

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report-py${{ matrix.python-version }}
          path: reports/report.html
